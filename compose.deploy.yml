volumes:
  devlog-mysql-data:

networks:
  default:
    name: devlog

x-web: &x-web # <<: *x-env
  build:
    context: .
    dockerfile: Dockerfile
  restart: on-failure
  tty: true

services:
  php:
    container_name: php
    build:
      context: ./docker/deploy/php
      dockerfile: Dockerfile
    volumes:
      - .:/data

  web:
    <<: *x-web
    container_name: web
    volumes_from:
      - php
    ports:
      - ${WEB_PORT}:80
    command: ["nginx"]
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    command: >
      --max_connections=${MYSQL_MAX_CONNECTIONS}
      --sql_mode=${MYSQL_SQL_MODE}
      --autocommit=${MYSQL_AUTOCOMMIT}
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: ${MYSQL_ALLOW_EMPTY_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_MAX_CONNECTIONS: ${MYSQL_MAX_CONNECTIONS}
      # MYSQL_USER: ${MYSQL_USER}
      # MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    expose:
      - ${MYSQL_PORT}
    volumes:
      - devlog-mysql-data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    environment:
      PMA_HOST: ${MYSQL_HOST}
      PMA_PORT: ${MYSQL_PORT}
      # PMA_USER: ${MYSQL_USER}
      # PMA_PASSWORD: ""
      UPLOAD_LIMIT: ${PMA_UPLOAD_LIMIT}
      PMA_ARBITRARY: 1
    ports:
      - ${PMA_PORT}:80

  # redis:
  #   image: redis/redis-stack:latest
  #   environment:
  #     - REDIS_ARGS=--requirepass ${REDIS_PASSWORD} --save 20 1
  #   restart: always
  #   ports:
  #     - 6379:6379
  #   volumes:
  #     - bueld-redis-data:/var/lib/redis-data

  # mail:
  #   container_name: mail
  #   image: marlonb/mailcrab:latest
  #   restart: unless-stopped
  #   ports:
  #     - 1080:1080
  #     - 1025:1025

  # Development server for fast updates.
  node:
    image: node:latest
    working_dir: /data
    volumes_from:
      - php
    command: npm run dev
    environment:
      NODE_ENV: "development"
      WATCHPACK_POLLING: "true"
      NODE_BUNDLE_ENTRY_FILE: ${NODE_BUNDLE_ENTRY_FILE}
      NODE_BUNDLE_OUTPUT_PATH: ${NODE_BUNDLE_OUTPUT_PATH}
      NODE_BUNDLE_OUTPUT_FILENAME: ${NODE_BUNDLE_OUTPUT_FILENAME}
      NODE_BUNDLE_OUTPUT_PUBLIC_PATH: ${NODE_BUNDLE_OUTPUT_PUBLIC_PATH}
      NODE_DEVSERVER_HOST: ${NODE_DEVSERVER_HOST}
      NODE_DEVSERVER_PORT: ${NODE_DEVSERVER_PORT}
      NODE_DEVSERVER_STATIC: ${NODE_DEVSERVER_STATIC}
      NODE_DEVSERVER_PROXY_ROOT: ${NODE_DEVSERVER_PROXY_ROOT}
    depends_on:
      - php
    restart: always
    ports:
      - "${NODE_DEVSERVER_PORT}:${NODE_DEVSERVER_PORT}"
